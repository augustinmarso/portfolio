<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Éditeur — portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scoutie+Sans:wght@400..700&display=swap" />
<style>
  :root { --fg: #111; --muted: #8a8a8a; --line: #e6e6e6; --soft: #f5f5f3; --accent: #1d1bff; --danger: #c62828; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 "Scoutie Sans", system-ui, sans-serif; color: var(--fg); background: #fff; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; }
  header .sp { flex: 1; }
  button { font: inherit; font-weight: 600; cursor: pointer; border: 1px solid var(--fg); background: #fff; color: var(--fg); border-radius: 999px; padding: 6px 14px; }
  button.primary { background: var(--fg); color: #fff; }
  button.ghost { border-color: transparent; color: var(--muted); padding: 4px 8px; }
  button.ghost:hover { color: var(--fg); }
  button.danger { border-color: var(--danger); color: var(--danger); }
  main { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 57px); }
  aside { border-right: 1px solid var(--line); padding: 12px; overflow-y: auto; max-height: calc(100vh - 57px); position: sticky; top: 57px; }
  aside ol { list-style: none; margin: 0; padding: 0; }
  aside li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: grab; user-select: none; }
  aside li:hover { background: var(--soft); }
  aside li.sel { background: var(--fg); color: #fff; }
  aside li img { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; background: var(--soft); flex: none; }
  aside li .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  aside li .n { font-size: 12px; opacity: .6; }
  .hint { font-size: 12px; color: var(--muted); margin: 8px 8px 12px; }
  section.editor { padding: 20px 28px 80px; }
  .fields { display: grid; grid-template-columns: 110px 1fr; gap: 8px 14px; max-width: 900px; align-items: center; }
  .fields label { color: var(--muted); font-weight: 600; }
  input, textarea { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: #fff; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  textarea { min-height: 120px; resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; margin: 22px 0 12px; flex-wrap: wrap; }
  .row h2 { margin: 0; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: #fff; cursor: grab; position: relative; }
  .card.drag { opacity: .35; }
  .card.over { outline: 2px dashed var(--accent); outline-offset: 2px; }
  .card img { display: block; width: 100%; height: 150px; object-fit: contain; background: var(--soft); border-radius: 6px; pointer-events: none; }
  .card .num { position: absolute; top: 12px; left: 12px; background: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 700; }
  .card .cov { position: absolute; top: 12px; right: 12px; background: var(--accent); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 700; }
  .card input { margin-top: 6px; font-size: 13px; padding: 5px 8px; }
  .card .acts { display: flex; justify-content: space-between; margin-top: 4px; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; display: grid; place-items: center; min-height: 190px; color: var(--muted); text-align: center; padding: 10px; cursor: pointer; }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--fg); color: #fff; padding: 8px 16px; border-radius: 999px; font-weight: 600; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.on { opacity: 1; }
  dialog { border: none; border-radius: 14px; padding: 22px; width: min(720px, 92vw); }
  dialog pre { background: var(--soft); border-radius: 8px; padding: 12px; max-height: 50vh; overflow: auto; white-space: pre-wrap; font-size: 12px; }
  .empty { color: var(--muted); padding: 40px; }
</style>
</head>
<body>
<header>
  <h1>Éditeur du portfolio</h1>
  <span class="hint" style="margin:0">visible uniquement sur cet ordinateur</span>
  <span class="sp"></span>
  <a href="http://localhost:5300" target="_blank" style="color:var(--fg);font-weight:600">aperçu local ↗</a>
  <button class="primary" id="publish">Publier en ligne</button>
</header>
<main>
  <aside>
    <div class="row" style="margin:4px 4px 6px"><button id="new">+ nouveau projet</button></div>
    <p class="hint">Glisser les projets pour changer leur ordre sur le site.</p>
    <ol id="list"></ol>
  </aside>
  <section class="editor" id="editor"><p class="empty">Choisir un projet à gauche.</p></section>
</main>
<div id="toast"></div>
<dialog id="pub"><h2 style="margin-top:0">Publication</h2><pre id="publog"></pre><div style="text-align:right"><button id="close">Fermer</button></div></dialog>
<input type="file" id="files" accept="image/*" multiple hidden />

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let data = { projects: [] }, current = null;

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1800); }
async function api(path, body, headers = { "Content-Type": "application/json" }) {
  const r = await fetch(path, { method: "POST", headers, body: body instanceof Blob ? body : JSON.stringify(body ?? {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function load(keep) {
  data = await (await fetch("/api/state")).json();
  renderList();
  const p = data.projects.find((x) => x.slug === (keep ?? current));
  if (p) select(p.slug); else $("#editor").innerHTML = '<p class="empty">Choisir un projet à gauche.</p>';
}
const thumbUrl = (p, f) => `/thumb/${encodeURIComponent(p.folder)}/${encodeURIComponent(f)}?v=${Date.now() >> 12}`;

// Glisser-déposer générique pour réordonner les enfants d'un conteneur
function sortable(container, itemSel, onDrop) {
  let dragged = null;
  container.querySelectorAll(itemSel).forEach((el) => {
    el.draggable = true;
    el.addEventListener("dragstart", (e) => { dragged = el; el.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; });
    el.addEventListener("dragend", () => { el.classList.remove("drag"); container.querySelectorAll(".over").forEach((o) => o.classList.remove("over")); dragged = null; });
    el.addEventListener("dragover", (e) => { if (!dragged || dragged === el) return; e.preventDefault(); el.classList.add("over"); });
    el.addEventListener("dragleave", () => el.classList.remove("over"));
    el.addEventListener("drop", (e) => {
      if (!dragged || dragged === el) return;
      e.preventDefault(); el.classList.remove("over");
      const items = [...container.querySelectorAll(itemSel)];
      const before = items.indexOf(dragged) > items.indexOf(el);
      el.parentNode.insertBefore(dragged, before ? el : el.nextSibling);
      onDrop([...container.querySelectorAll(itemSel)].map((x) => x.dataset.key));
    });
  });
}

function renderList() {
  const ol = $("#list");
  ol.innerHTML = data.projects.map((p) => `
    <li data-key="${p.slug}" class="${p.slug === current ? "sel" : ""}">
      ${p.images[0] ? `<img src="${thumbUrl(p, p.images[0])}" alt="">` : `<img alt="">`}
      <span class="t">${esc(p.title)}</span><span class="n">${p.images.length}</span>
    </li>`).join("");
  ol.querySelectorAll("li").forEach((li) => li.addEventListener("click", () => select(li.dataset.key)));
  sortable(ol, "li", async (order) => { await api("/api/order", { order }); toast("Ordre des projets enregistré"); data.projects.sort((a, b) => order.indexOf(a.slug) - order.indexOf(b.slug)); });
}

function select(slug) {
  current = slug;
  document.querySelectorAll("#list li").forEach((li) => li.classList.toggle("sel", li.dataset.key === slug));
  const p = data.projects.find((x) => x.slug === slug);
  const t = p.text;
  $("#editor").innerHTML = `
    <div class="fields">
      <label>titre</label><input id="f-title" value="${esc(p.title)}">
      <label>année</label><input id="f-year" value="${esc(t.year)}">
      <label>contexte</label><input id="f-context" value="${esc(t.context)}">
      <label>thèmes</label><input id="f-themes" value="${esc((t.themes || []).join(", "))}" placeholder="objet, service, jeu…">
      <label style="align-self:start;padding-top:8px">texte</label><textarea id="f-intro">${esc(t.intro)}</textarea>
    </div>
    <div class="row">
      <button class="primary" id="save">Enregistrer les textes</button>
      <span class="sp" style="flex:1"></span>
      <button class="danger" id="delproj">Supprimer le projet</button>
    </div>
    <div class="row"><h2>Images (${p.images.length})</h2><span class="hint" style="margin:0">glisser pour réordonner · « couverture » choisit la vignette de l'index</span></div>
    <div class="grid" id="imgs">
      ${p.images.map((f, i) => `
        <div class="card" data-key="${esc(f)}">
          <span class="num">${i + 1}</span>
          ${p.cover === f.replace(/\.[^.]+$/, "") ? '<span class="cov">couverture</span>' : ""}
          <img src="${thumbUrl(p, f)}" alt="" loading="lazy">
          <input class="cap" value="${esc(t.captions?.[i])}" placeholder="légende">
          <div class="acts"><button class="ghost setcov">couverture</button><button class="ghost del">supprimer</button></div>
        </div>`).join("")}
      <div class="drop" id="drop">Déposer des images ici<br>ou cliquer pour en choisir</div>
    </div>`;

  const collect = () => ({
    title: $("#f-title").value.trim(),
    year: $("#f-year").value.trim() || null,
    context: $("#f-context").value.trim() || null,
    themes: $("#f-themes").value.split(",").map((s) => s.trim()).filter(Boolean),
    intro: $("#f-intro").value,
    captions: [...document.querySelectorAll(".card .cap")].map((i) => i.value.trim()),
  });
  const save = async () => { await api(`/api/${slug}/text`, collect()); toast("Textes enregistrés"); };
  $("#save").onclick = async () => { await save(); await load(slug); };
  document.querySelectorAll(".card .cap").forEach((i) => i.addEventListener("change", save));

  sortable($("#imgs"), ".card", async (files) => { await save(); await api(`/api/${slug}/reorder`, { files }); toast("Ordre des images enregistré"); await load(slug); });
  document.querySelectorAll(".card").forEach((c) => {
    $(".del", c).onclick = async (e) => { e.stopPropagation(); if (!confirm("Retirer cette image ? (elle part dans la corbeille, rien n'est effacé)")) return; await save(); await api(`/api/${slug}/delete-image`, { file: c.dataset.key }); toast("Image retirée"); await load(slug); };
    $(".setcov", c).onclick = async (e) => { e.stopPropagation(); await api(`/api/${slug}/cover`, { file: c.dataset.key }); toast("Couverture choisie"); await load(slug); };
  });
  $("#delproj").onclick = async () => { if (!confirm(`Retirer le projet « ${p.title} » du site ? (il part dans la corbeille, rien n'est effacé)`)) return; await api(`/api/${slug}/delete`); current = null; toast("Projet retiré"); await load(); };

  const drop = $("#drop");
  drop.onclick = () => $("#files").click();
  $("#files").onchange = (e) => addFiles(slug, e.target.files);
  drop.addEventListener("dragover", (e) => { if (e.dataTransfer.types.includes("Files")) { e.preventDefault(); drop.classList.add("over"); } });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); addFiles(slug, e.dataTransfer.files); });
}

async function addFiles(slug, files) {
  for (const f of files) {
    toast(`Ajout de ${f.name}…`);
    await api(`/api/${slug}/add-image`, f, { "X-Filename": encodeURIComponent(f.name) });
  }
  $("#files").value = "";
  toast(`${files.length} image(s) ajoutée(s)`);
  await load(slug);
}

$("#new").onclick = async () => {
  const title = prompt("Titre du nouveau projet :");
  if (!title) return;
  try { const r = await api("/api/new", { title }); await load(r.slug); toast("Projet créé"); } catch (e) { alert(e.message); }
};

$("#publish").onclick = async () => {
  if (!confirm("Mettre en ligne toutes les modifications ? (le site public sera mis à jour)")) return;
  const log = $("#publog"); log.textContent = ""; $("#pub").showModal(); $("#close").disabled = true;
  const r = await fetch("/api/publish", { method: "POST" });
  const reader = r.body.getReader(); const dec = new TextDecoder();
  for (;;) { const { done, value } = await reader.read(); if (done) break; log.textContent += dec.decode(value); log.scrollTop = log.scrollHeight; }
  $("#close").disabled = false;
};
$("#close").onclick = () => $("#pub").close();

load().catch((e) => { $("#editor").innerHTML = `<p class="empty">Erreur : ${esc(e.message)}</p>`; });
</script>
</body>
</html>
